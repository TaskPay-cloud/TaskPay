{% extends "base.html" %}
{% block title %}{{ t('forgot.title') }} — TaskPay{% endblock %}
{% block content %}
<section class="auth-box">
    <h2>{{ t('forgot.title') }}</h2>
    {% if sent %}
        <p class="hint">{{ t('forgot.sent') }}</p>
    {% else %}
        <p class="hint">{{ t('forgot.sub') }}</p>
        <form method="post">
            <label>{{ t('forgot.email_label') }}</label>
            <input type="email" name="email" required>
            <button type="submit" class="cta">{{ t('forgot.submit') }}</button>
        </form>
    {% endif %}
    <p><a href="{{ url_for('login') }}">{{ t('forgot.back_to_login') }}</a></p>
</section>
{% endblock %}
