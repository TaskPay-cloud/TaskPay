{% extends "base.html" %}
{% block title %}{{ t('reset.title') }} — TaskPay{% endblock %}
{% block content %}
<section class="auth-box">
    <h2>{{ t('reset.title') }}</h2>
    {% if invalid %}
        <p class="error">{{ t('reset.invalid') }}</p>
        <p><a href="{{ url_for('forgot_password') }}">{{ t('reset.request_new') }}</a></p>
    {% else %}
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post">
            <label>{{ t('reset.password_label') }}</label>
            <input type="password" name="password" required minlength="6">
            <label>{{ t('reset.confirm_label') }}</label>
            <input type="password" name="confirm_password" required minlength="6">
            <button type="submit" class="cta">{{ t('reset.submit') }}</button>
        </form>
    {% endif %}
</section>
{% endblock %}
